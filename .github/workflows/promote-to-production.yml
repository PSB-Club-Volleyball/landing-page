name: Deploy to Production

# Manually promote staging to production: merges `staging` into `main` and
# pushes, which triggers deploy.yml (push to main) to deploy production.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge staging into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin staging
          git merge --no-ff origin/staging -m "Promote staging to production"
          git push origin main
