name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Pages rejects `wrangler pages deploy --config <custom path>` (config
      # must be named wrangler.toml in the working directory). We can't run
      # wrangler from a subdirectory to work around that either: it discovers
      # the `functions/` directory relative to its cwd, not the deployed
      # directory, so a relocated cwd silently drops all Pages Functions and
      # the deploy becomes static-assets-only. Overwrite the root
      # wrangler.toml instead so cwd (and therefore `functions/`) stays put.
      - name: Swap in the staging wrangler config
        run: cp wrangler.staging.toml wrangler.toml

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=behrend-club-volleyball-staging --branch=staging
