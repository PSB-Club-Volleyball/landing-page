name = "behrend-club-volleyball"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Pages only recognizes "production" and "preview" as environment names.
# The production branch (main) uses the real database/bucket; every other
# branch (PR previews) is an ephemeral deployment that uses a separate
# "preview" backend so it never touches production data. See
# docs/backend-setup.md.

[[env.production.d1_databases]]
binding = "DB"
database_name = "behrend-club-volleyball"
database_id = "eca8d67f-5fef-44c1-9f2c-6df039abfbb8"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "behrend-club-volleyball"

# Non-secret config. Secrets (OAuth client IDs/secrets) are set separately
# with `wrangler pages secret put <NAME> --env production` — see
# docs/backend-setup.md.
[env.production.vars]
PUBLIC_URL = "https://behrendclubvolleyball.org"
# Comma-separated emails that are auto-approved the first time they sign in,
# so there's at least one admin who can approve everyone else.
ADMIN_BOOTSTRAP_EMAILS = "ethanluh@gmail.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "behrend-club-volleyball-preview"
database_id = "e2b27718-eb68-40d2-a94e-9909066be0b5"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "behrend-club-volleyball-preview"

[env.preview.vars]
PUBLIC_URL = "https://behrendclubvolleyball.org"
ADMIN_BOOTSTRAP_EMAILS = "ethanluh@gmail.com"
